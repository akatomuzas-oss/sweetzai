<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- SEO: this is now a pure redirect shell. Tell crawlers the canonical
         home is sweetz.ai and that they shouldn't index this page. -->
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://sweetz.ai/" />

    <title>Sweetz — Redirecting…</title>
    <meta name="description" content="Redirecting to sweetz.ai…" />

    <!-- Belt-and-suspenders: <meta refresh> fires after 1s if the JS
         redirect below has any issue. Most users hit the JS path instantly. -->
    <meta http-equiv="refresh" content="1;url=https://sweetz.ai/" />

    <!-- Preconnect so the JS redirect resolves the next hop fast -->
    <link rel="preconnect" href="https://sweetz.ai" crossorigin />
    <link rel="dns-prefetch" href="https://sweetz.ai" />

    <!-- FirstPromoter affiliate tracking — kept so the ?fpr= cookie
         capture still works on this domain before the JS redirect
         forwards it to sweetz.ai as a query param. Same account as
         the main app so the affiliate credit attaches correctly. -->
    <script>
      (function(w){w.fpr=w.fpr||function(){w.fpr.q=w.fpr.q||[];w.fpr.q[arguments[0]=='set'?'unshift':'push'](arguments);};})(window);
      fpr("init", { cid: "o3ki8oeh" });
      fpr("click");
    </script>
    <script src="https://cdn.firstpromoter.com/fpr.js" async></script>

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #000; color: rgba(255,255,255,0.4); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; height: 100%; }
      body { display: flex; align-items: center; justify-content: center; }
      .msg { text-align: center; padding: 1.5rem; }
      .msg a { color: #ec4899; text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="msg">
      <p>Redirecting to <a href="https://sweetz.ai/">sweetz.ai</a>…</p>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
